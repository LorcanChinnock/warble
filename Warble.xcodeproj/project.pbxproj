/* Begin PBXShellScriptBuildPhase section */
		9A989AB99F96F44C117D157C /* Sign Sparkle's helpers */ = {isa = PBXShellScriptBuildPhase; buildActionMask = 2147483647; files = (); alwaysOutOfDate = 1; inputFileListPaths = ( ); inputPaths = ( ); name = "Sign Sparkle's helpers"; outputFileListPaths = ( ); outputPaths = ( ); shellPath = /bin/sh; shellScript = "# Sparkle's helpers keep the signature they shipped with when Xcode embeds the framework. Sign them, then the\n# framework, with the app's identity, inside-out as Sparkle's docs advise (never --deep), so an update installed\n# by the release keeps the permissions macOS granted, such as Automation. Xcode signs the app itself after this phase.\nset -eu\nsparkle=\"$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework\"\nfor part in XPCServices/Installer.xpc XPCServices/Downloader.xpc Autoupdate Updater.app; do\n    codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" --preserve-metadata=entitlements \"$sparkle/Versions/B/$part\"\ndone\ncodesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" \"$sparkle\"\n"; showEnvVarsInLog = 0; runOnlyForDeploymentPostprocessing = 0; };
		E8B0F9309C888484EF97C859 /* Build the adapter */ = {isa = PBXShellScriptBuildPhase; buildActionMask = 2147483647; files = (); alwaysOutOfDate = 1; inputFileListPaths = ( ); inputPaths = ( ); name = "Build the adapter"; outputFileListPaths = ( ); outputPaths = ( ); shellPath = /bin/sh; shellScript = "# Builds ungive/mediaremote-adapter from the Vendor/mediaremote-adapter submodule with CMake and puts it in the app's\n# Resources, signed with the app's identity. Since macOS 15.4 MediaRemote answers only Apple-signed processes, so the\n# now-playing source runs the adapter's script under /usr/bin/perl, which loads this framework. It's only bundled,\n# never linked. The adapter's CMakeLists.txt builds both architectures itself. See CONTRIBUTING.md › Updating the adapter.\nset -eu\nsrc=\"$SRCROOT/Vendor/mediaremote-adapter\"\nif [ ! -f \"$src/CMakeLists.txt\" ]; then\n    echo \"error: Vendor/mediaremote-adapter is empty; run git submodule update --init.\" >&2\n    exit 1\nfi\n# Xcode runs scripts with a short PATH that misses Homebrew.\nPATH=\"$PATH:/opt/homebrew/bin:/usr/local/bin\"\nif ! command -v cmake >/dev/null; then\n    echo \"error: building the adapter needs CMake; install it with brew install cmake.\" >&2\n    exit 1\nfi\n# A clean environment, so none of Xcode's build settings reach CMake. Without the deployment target, CMake would target\n# the Mac doing the build, and the framework wouldn't load on older macOS.\nbuild=\"$TARGET_TEMP_DIR/mediaremote-adapter\"\nrun() {\n    env -i PATH=\"$PATH\" HOME=\"$HOME\" DEVELOPER_DIR=\"$DEVELOPER_DIR\" \"$@\"\n}\n# CMake's output goes to a log, which is printed only when the build fails.\nlog=\"$TARGET_TEMP_DIR/mediaremote-adapter.log\"\nif ! { run cmake -S \"$src\" -B \"$build\" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=\"$MACOSX_DEPLOYMENT_TARGET\" &&\n    run cmake --build \"$build\" --parallel; } >\"$log\" 2>&1; then\n    cat \"$log\" >&2\n    echo \"error: building the adapter failed; CMake's output is above.\" >&2\n    exit 1\nfi\n\n# The now-playing source runs `/usr/bin/perl <script> <framework> <test client> <command>` with these paths. The test\n# client is only for the `test` command, which fakes playback to check the adapter still works.\nresources=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"\nmkdir -p \"$resources\"\ncp \"$src/bin/mediaremote-adapter.pl\" \"$resources/mediaremote-adapter.pl\"\nrm -rf \"$resources/MediaRemoteAdapter.framework\"\nditto \"$build/MediaRemoteAdapter.framework\" \"$resources/MediaRemoteAdapter.framework\"\ncp \"$build/MediaRemoteAdapterTestClient\" \"$resources/MediaRemoteAdapterTestClient\"\n# CMake signs them ad hoc. Sign them again with the app's identity before Xcode signs the app and seals its resources.\ncodesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" \"$resources/MediaRemoteAdapterTestClient\" 2>/dev/null\ncodesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" \"$resources/MediaRemoteAdapter.framework\" 2>/dev/null\n"; showEnvVarsInLog = 0; runOnlyForDeploymentPostprocessing = 0; };
/* End PBXShellScriptBuildPhase section */

