version: 2
updates:
  # Pinned actions are bumped as a reviewed change to the commit SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  # mediaremote-adapter, in Vendor/. Dependabot follows the adapter's main branch rather than its tags, so a bump may
  # be an untagged commit. See CONTRIBUTING.md › Updating the adapter.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  # Sparkle. A bump changes Package.resolved, which release builds require (--force-resolved-versions).
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
