name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only Dependabot's own PRs. Auto-merge waits for the required `linux` and `macos` checks.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Patch and minor bumps only. Major bumps, and the Sparkle (swift) and mediaremote-adapter
      # (gitsubmodule) bumps that ship inside the app, stay manual.
      - if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major'
          && steps.metadata.outputs.package-ecosystem != 'swift'
          && steps.metadata.outputs.package-ecosystem != 'gitsubmodule'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
